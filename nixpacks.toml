[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@11.2.2 --activate",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @quotatain/database db:generate",
  "pnpm --filter @quotatain/database build",
  "pnpm --filter @quotatain/api build",
  "pnpm --filter @quotatain/api deploy --prod /app/deploy"
]

[start]
cmd = "node /app/deploy/dist/index.js"
